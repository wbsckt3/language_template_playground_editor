<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Code Editor</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.9/codemirror.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.9/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.9/mode/clike/clike.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jwt-decode@4.0.0/build/cjs/index.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      background-color: #e7e7f0;
    }

    h1 {
      margin-top: 20px;
    }

    #editor-container {
      width: 94%;
      max-width: 1200px;
      margin-top: 20px;
    }

    #code-editor {
      height: 400px;
      width: 100%;
    }

    #save-button-container {
      position: relative;
      display: inline-block;
       width: 100%;
    }
    
    #save-button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      width: 100%; /* Cambiado para ocupar el 100% del contenedor */
      margin-top: -8px;
      background: #5fa60b;
      color: #fff;
      border: none;
      box-sizing: border-box; /* Asegura que el padding no desborde el ancho */
    }
    
    .loading-icon {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #ccc;
      border-top: 3px solid #333;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      position: absolute;
      top: 50%;
      left: 1%;
      transform: translate(-50%, -50%);
      margin-top: -17px;
    }
    
    .hidden {
      display: none;
    }
    
    @keyframes spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    #progress {
      margin-top: -45px;
      width: 100%;
      max-width: 1200px;
      text-align: center;
    }

    #progress-status {
      font-size: 15px;
      margin-bottom: 10px;
      text-align: end;
      display: block; /* Asegúrate de que sea visible */
    }

    .status-pending {
      color: #888; /* Gris */
    }

    .status-in-progress {
      color: #ff9800; /* Naranja */
    }

    .status-completed {
      color: #4caf50; /* Verde */
    }

    #progress-steps {
      list-style: none;
      padding: 0;
      margin-bottom: 10px;
      text-align: end;
    }

   #progressBar {
    position: relative;
    height: 20px;
    background-color: #ddd; /* Fondo de la barra */
    border-radius: 10px; /* Esquinas redondeadas */
    overflow: hidden; /* Para evitar que el contenido desborde */
    margin-left: 28px;
  }
  
  #progressBar::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: var(--progress-width, 0%); /* Ancho dinámico desde variable CSS */
    background-color: #4caf50; /* Color del progreso */
    transition: width 0.5s ease; /* Animación suave */
    z-index: 1; /* Fondo de la animación */
  }
  
  #progressBar span {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    line-height: 20px;
    font-weight: bold;
    color: #fff; /* Texto blanco */
    z-index: 2; /* Texto encima del progreso */
  }

    #result {
      display: inline-block; /* Coloca los divs en línea */
      vertical-align: middle; /* Alinea verticalmente */
      margin: 5px; /* Espaciado */
      background: #f7f6bf;
      padding: 10px;
      border-radius: 10px;
      font-size: 14px;
    }

    .CodeMirror {
      font-family: monospace;
      height: 340px !important; 
      color: #000;
      direction: ltr;
    }

  </style>
</head>
<body>
  <div id="editor-container">
    <p style="margin-top: -6px; font-weight: bold"> Java Spring Boot | Uso de String.format en un Endpoint REST para Generar Saludos Personalizados</p>
    <textarea id="code-editor"></textarea>
      <div id="save-button-container">
        <button id="save-button" class="active">Test</button>
        <div class="loading-icon hidden" id="loadingIcon"></div>
      </div>
  </div>

  <!-- Modal -->
  <div id="modal-exito" style="width: 76%; top:37%; background: #e8fff1; display: none; position: fixed; left: 50%; transform: translate(-50%, -50%); padding: 20px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.2);">
      <p>✅ Ok! Las pruebas han sido completadas exitosamente.</p>
      <p id="exito-message"></p>
      <button id="send-response-button" onClick="guardarResultados()" style="background: #42e179; border: none; padding: 10px; color: #fff; font-weight: bold;">Guardar progreso</button>
      <button onClick="cerrarModalExito ()" style="border: none;  padding: 10px;">Cerrar</button>
  </div>

  <!-- Modal de Error -->
  <div id="modal-error" style="width: 76%; top:37%; background: #ffe1e1; display: none; position: fixed; left: 50%; transform: translate(-50%, -50%); background: #ffebee; padding: 20px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(255,0,0,0.3);">
      <p>❌ La prueba ha fallado.</p>
      <p id="error-message"></p>
      <button onClick="location.reload()" style="border: none; padding: 10px; background: #ff0000c7; color: #fff; font-weight: bold;">Reintentar</button>
  </div>
	
 <script>

    // Obtener el parámetro `token` de la URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    if (token) {
	    
	    // Realiza una solicitud al servicio externo para validar el token
	    fetch(`https://www.refactorii.com/validate-token?token=${token}`)
	    .then(response => response.json())
	    .then(data => {
	        if (data.valid) {
	            console.log(data.valid);
	             // Decodifica el token para obtener el payload
		     var base64Url = token.split('.')[1];
	             var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
	             var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
	                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
	             }).join(''));
                     const decodedToken = JSON.parse(jsonPayload);
         	     const recipeId = decodedToken._id; // Asegúrate de usar el nombre correcto del campo en el payload
                     console.log('Recipe ID:', recipeId);
		     // Almacenar recipeId en local storage
                     localStorage.setItem('recipeId', recipeId);
		     loadMarkdownFiles();
	    	} else {
	  	    console.log(data.valid);
	  	    document.body.innerHTML = 'Access denied. Invalid token.';
	  	}
	    }).catch(error => {
	  	document.body.innerHTML = 'Error validating token.';
	  	console.error('Error:', error);
	    });
	    
  } else {
     document.body.innerHTML = 'Access denied. No token provided.';
  }

   
  // (1) codemirror editor initial code
  const initialJavaCode = `código Java`
  
    const editor = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
      mode: "text/x-java",
      theme: "default",
      lineNumbers: true,
      autoCloseBrackets: true,
    });
  
    editor.setValue(initialJavaCode);
    
    const templateName   = "spring_boot"; 
    const exerciseNumber = "exercise5";
    	 
    // (2) Función para GET de archivos Markdown y llenar el editor
    async function loadMarkdownFiles() {
  
      try {

	exerciseFile1  = "GreetingController5Model.txt"; 
        exerciseFile2  = "GreetingModel.txt"; 
        // Realizar POST para obtener los archivos Markdown
        const response = await fetch('https://www.refactorii.com/get-markdown-files', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            templateName, 
            exerciseNumber, 
	          exerciseFile1,
            exerciseFile2
          }),
        });
  
        if (!response.ok) {
          throw new Error(`Error en la solicitud: ${response.statusText}`);
        }
  
        const data = await response.json();
  
        if (data.success && data.files && data.files.length > 0) {
          // Concatenar contenido de los archivos
          //const combinedContent = data.files.map(file => `// ${file.name}\n${file.content}`).join('\n\n');
	  const combinedContent = data.files.map(file => file.content).join('\n\n');
          editor.setValue(combinedContent);
        } else {
          alert('No se encontraron archivos Markdown o hubo un problema con la respuesta.');
          console.log('Respuesta del servidor:', data);
        }
      } catch (error) {
        console.error('Error al obtener los archivos Markdown:', error);
        alert('Hubo un error al obtener los archivos Markdown.');
      } finally {
        // Ocultar el ícono de carga
       if (loadingIcon) {
            // loadingIcon.style.display = 'none'; // Ocultar
            // o si deseas eliminarlo del DOM:
            // loadingIcon.remove();
        }
      }
    }
  
    // Ejecutar la función al cargar la página
    // window.onload = loadMarkdownFiles;

    const user = Date.now();

    const saveButton = document.getElementById('save-button');
    const loadingIcon = document.getElementById('loadingIcon');
   
    // (3) método para envío del codigo 
    document.getElementById('save-button').addEventListener('click', async () => {
             
      const code = editor.getValue().trim(); // Código actual del editor
      //const code = editor.getValue().trim().replace(/\r\n/g, '\n'); // Normaliza saltos de línea
      //const code = btoa(editor.getValue().trim().replace(/\r\n/g, '\n')); // Codifica el código en Base64
      const codeBase64 = btoa(code);

      exerciseFile1 = "GreetingController5.java"; 
      exerciseFile2  = "Greeting.java"; 
    
      if (!code) {
        alert('El código está vacío. Escribe algo antes de guardar.');
        return;
      }
    
      // Deshabilitar el botón y mostrar el ícono de carga
      saveButton.disabled = true;
      loadingIcon.style.display = 'block';
    
      try {
        // Enviar los datos al back-end para realizar la actualización en GitHub
        const response = await fetch('https://www.refactorii.com/update-markdown-files', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
             codeBase64,         
             templateName, 
             exerciseNumber,
             user,
	           exerciseFile1,
             exerciseFile2
          }),
        });
    
        const data = await response.json();
    
        if (data.success) {
          startFetching(); // Iniciar el proceso de consulta
        } else {
          alert('Hubo un error al guardar el código.');
        }
      } catch (error) {
        console.error('Error al guardar el código:', error);
        alert('Hubo un error al guardar el código.');
      } finally {

      }
    });

    let intervalId = null; // Almacenar el ID del intervalo
    let isFetching = false; // Bandera para controlar si las consultas están activas
    let fetchingTimeout = 6000; // Timeout para esperar que el workflow se ejecute (3 minutos en milisegundos)
    
    let pollingInterval;
    // Función para iniciar el proceso de consulta
    function startFetching() {
      if (isFetching) return; // Evitar múltiples inicios
      isFetching = true;
      console.log('Consultas iniciadas...');
      
      // Llamar a la función cuando inicie el proceso
       pollingInterval = setInterval(fetchTestMessages, 5000); // Consultar cada 5 segundos
    }
    
    // Función para detener el proceso de consulta
    function stopFetching() {
      if (intervalId) {
        clearInterval(pollingInterval);
        intervalId = null;
        isFetching = false;
        console.log('Consultas detenidas.');
      }
    }
	
	async function fetchTestMessages() {
			try {
			const response = await fetch('https://www.refactorii.com/test-result-get-testMsg', {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json',
					'User-Email': user,
				},
				body: JSON.stringify({})
			});
		
			// Verificar si la respuesta está vacía o no es JSON válido
			const text = await response.text();  // Primero obtenemos el texto en crudo
			if (!text) {
				console.warn('🔴 Respuesta vacía del servidor. Esperando más datos...');
				return;
			}
		
			// Intentar parsear el JSON
			let data;
			try {
				data = JSON.parse(text);
			} catch (jsonError) {
				console.error('❌ Error al parsear JSON:', jsonError, 'Respuesta recibida:', text);
				return;
			}
		
			console.log('✅ Mensaje del test recibido:', data);
		
			// Procesar el mensaje recibido
			const messages = data.messages || "";
			console.log('Mensajes recibidos:', messages);
		
			const hasCompletedStatus = messages.includes("✅ Prueba Exitosa") || messages.includes("❌ Prueba Fallida");
		
			document.getElementById('loadingIcon').style.display = 'none';
		
			if (messages.includes("✅ Prueba Exitosa")) {
				console.log('✅ Prueba exitosa. Mostrando modal de éxito.');
				document.getElementById('exito-message').innerText = messages;
				mostrarModalExito();
			} else if (messages.includes("❌ Prueba Fallida")) {
				console.log('❌ Prueba fallida. Mostrando modal de error.');
				document.getElementById('error-message').innerText = messages;
				mostrarModalError();
			}
		
			if (hasCompletedStatus) {
				stopFetching();
			}
		} catch (error) {
			console.error('❌ Error al obtener TestMsg:', error);
		}

	}
	 
async function guardarResultados() {
	    const formData = JSON.parse(localStorage.getItem("formData"));
	    const email = formData ? formData.Email : null;
            // Obtener el `recipeId` (ahora llamado _id) directamente de la URL
	    const urlParams = new URLSearchParams(window.location.search);
	    const recipeId = urlParams.get('_id'); // Extraemos el _id de la URL
	    if (!recipeId) {
	        console.error('No _id (recipeId) found in the URL');
	        return;
	    }
	    // Crear el objeto que se guardará en la base de datos
	    // Obtener la URL actual
	    const currentUrl = window.location.href;
	    // Crear un objeto URL
	    const url = new URL(currentUrl);
	    // Eliminar el parámetro 'token' de la query string
	    url.searchParams.delete('token');
	    // Obtener el pathname sin el token
            const urlWithoutToken = url.pathname.split('/').pop();
	    const recipeCalificadaOk = {
	        recipeId: recipeId,
		url: urlWithoutToken,
	        date: new Date().toISOString()
	    };
	    try {
	        const response = await fetch('https://www.refactorii.com/updateOneGoogleSigninUserRecipe', {
	            method: 'POST',
	            headers: {
	                'Content-Type': 'application/json'
	            },
	            //body: JSON.stringify({ Email: email, recipeCalificadaOk: recipeId })
		    body: JSON.stringify({ Email: email, recipeCalificadaOk })	
	        });
	        const data = await response.json();
	        console.log('Server responds:', "Ok");
		// Redirección a la página original
                window.location.href = `https://www.refactorii.com/recipes/${recipeId}`;
	    } catch (error) {
	        console.error('Error sending the results to the server:', error);
	    }
    }   

    function mostrarModalExito() {
    	document.getElementById('modal-exito').style.display = 'block';
    }
    function cerrarModalExito() {
        document.getElementById('modal-exito').style.display = 'none';
    }
    function mostrarModalError() {
    	document.getElementById('modal-error').style.display = 'block';
    }
    function cerrarModalError() {
        document.getElementById('modal-error').style.display = 'none';
    }
    
  </script>

</body>
</html>
